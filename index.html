<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Convite Chá de Fraldas</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
    }
    .iframe-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      /* Aumenta a altura do iframe e empurra a barra inferior para fora da tela */
      height: calc(100% + 50px);
      overflow: hidden;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div class="iframe-container">
    <iframe src="https://www.canva.com/design/DAHXErSs0ss/r9tLAHXb-buO1YebFeClfQ/view?embed" allowfullscreen="allowfullscreen" allow="fullscreen"></iframe>
  </div>
</body>
</html>
